---
layout: default
title: Wishlist
---

<div class="section is-grey">
  <div class="container">
    <template x-if="$store.app.isLoggedIn === false">
      <div class="placeholder-outer">
        <div class="page-placeholder">
          <div class="page-placeholder-inner">
            <img src="/img/illustrations/placeholder.svg" alt="" />
            <h3 class="title is-5 is-leading">Wishlist not available</h3>
            <p>
              Wishlists are only available to logged in users. Please login to
              your account. If you don't have an account, go ahead and create
              one.
            </p>
            <div class="buttons is-centered">
              <a href="/login.html" class="button is-primary raised is-long-2"
                >Login</a
              >
              <a href="/home.html" class="button is-long-2">Back Home</a>
            </div>
          </div>
        </div>
      </div>
    </template>

    <template x-if="$store.app.isLoggedIn">
      <div class="account-app">
        <div class="account-header">
          <img
            class="header-avatar"
            src="/img/avatars/4.jpg"
            alt="Account photo"
          />
          <div class="header-meta">
            <h2 class="title is-3 is-thin">Wishlist</h2>
            <h4 class="subtitle is-5 stressed-1">Properties that you liked</h4>
          </div>
        </div>

        <div class="account-whishlist py-6" x-data="{activeTab: 'rent'}">
          <div class="tabs-wrapper">
            <div class="tabs">
              <ul>
                <li
                  class="is-active"
                  x-bind:class="{'is-active': activeTab === 'rent'}"
                >
                  <a x-on:click.prevent="activeTab = 'rent'">Rent</a>
                </li>
                <li x-bind:class="{'is-active': activeTab === 'buy'}">
                  <a x-on:click.prevent="activeTab = 'buy'">Buy</a>
                </li>
              </ul>
            </div>

            <div class="tab-content-wrap">
              <!--For rent-->
              <div x-show.transition="activeTab === 'rent'" class="tab-content">
                <div class="tab-placeholder">
                  <p class="mb-5">
                    <span
                      >Looks like you didn't add properties to rent to your
                      wishlist.</span
                    >
                    <a class="slide-link ml-2">Learn more</a>
                  </p>
                  <img src="img/illustrations/cityline.svg" alt="" />
                </div>
              </div>

              <!--For sale-->
              <div x-show.transition="activeTab === 'buy'" class="tab-content">
                <div class="tab-placeholder mb-5">
                  <p>
                    <span>These are your favorite properties on sale.</span>
                    <a class="slide-link ml-2">Learn More</a>
                  </p>
                </div>
                <div class="property-cards">
                  <div class="columns is-multiline b-columns-half-tablet-p">
                    <!-- Property -->
                    <div class="column is-4">
                      <a href="#" class="property-card">
                        <img
                          src="/img/photo/properties/1.jpg"
                          alt="showcase photo"
                        />
                        <div class="property-content">
                          <div class="property-info">
                            <h3 class="title is-5 is-narrow is-bold">
                              $240,000 USD
                            </h3>
                            <p>14, Greenwalk passage, San Diego</p>
                          </div>
                          <div class="property-details">
                            <div class="property-detail">
                              <div class="detail-head">
                                <i
                                  class="iconify"
                                  data-icon="lucide:bed-double"
                                ></i>
                                <span>3</span>
                              </div>
                              <div class="detail-content">
                                <p>Bedrooms</p>
                              </div>
                            </div>
                            <div class="property-detail">
                              <div class="detail-head">
                                <i class="iconify" data-icon="lucide:bath"></i>
                                <span>2</span>
                              </div>
                              <div class="detail-content">
                                <p>Bathrooms</p>
                              </div>
                            </div>
                            <div class="property-detail">
                              <div class="detail-head">
                                <i
                                  class="iconify"
                                  data-icon="lucide:box-select"
                                ></i>
                                <span>190m²</span>
                              </div>
                              <div class="detail-content">
                                <p>Living Area</p>
                              </div>
                            </div>
                          </div>
                        </div>
                      </a>
                    </div>

                    <!-- Property -->
                    <div class="column is-4">
                      <a href="#" class="property-card">
                        <img
                          src="/img/photo/properties/2.jpg"
                          alt="showcase photo"
                        />
                        <div class="property-content">
